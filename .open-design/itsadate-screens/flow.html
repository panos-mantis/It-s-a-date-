<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>It&#39;s a Date screens — flow map</title>
<style>
:root{--bg:#f6f6f4;--fg:#1c1c1c;--muted:#6b6b6b;--card:#fff;--line:#4a4a4a;--bad:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#161617;--fg:#eee;--muted:#9a9a9a;--card:#232325;--line:#bbb;--bad:#ff6b6b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
header{padding:20px 24px 4px}h1{margin:0 0 4px;font-size:20px}p{margin:0;color:var(--muted)}.bad{color:var(--bad)}
.map{position:relative;display:flex;gap:96px;padding:24px;overflow:auto;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:40px}
.screen{margin:0;width:236px;background:var(--card);border-radius:12px;padding:8px;box-shadow:0 1px 3px rgba(0,0,0,.12);position:relative;z-index:1}
.screen.missing{border:2px dashed var(--bad);box-shadow:none}
.thumb{overflow:hidden;border-radius:8px;background:var(--bg);position:relative}
.thumb iframe{border:0;transform-origin:0 0;pointer-events:none;background:#fff}
.open{display:block}.unbuilt{display:grid;place-items:center;height:100%;color:var(--bad)}
figcaption{display:flex;justify-content:space-between;gap:8px;padding:8px 2px 0}figcaption span{color:var(--muted)}
svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
svg path{fill:none;stroke:var(--line);stroke-width:1.5}svg path.missing{stroke:var(--bad);stroke-dasharray:6 5}
svg text{fill:var(--muted);font-size:11px}svg text.missing{fill:var(--bad)}svg path.task{stroke-width:3;opacity:.85}
.tasks{list-style:none;display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 0 0;padding:0}.tasks i{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
</style></head><body>

<script>
(function(){var edges=[{"from":"home","to":"idea-detail","label":"A slow Saturday at the farmers market, then a picnic lunch by the river for two!","missing":false},{"from":"home","to":"auth","label":"Log in to save Bookshop and coffee afternoon","missing":false},{"from":"home","to":"share","label":"Share an idea","missing":false},{"from":"home","to":"profile","label":"Saved ideas","missing":false},{"from":"home","to":"admin","label":"Admin","missing":false},{"from":"idea-detail","to":"home","label":"Back to all ideas","missing":false},{"from":"idea-detail","to":"auth","label":"Log in to rate","missing":false},{"from":"share","to":"home","label":"All ideas","missing":false},{"from":"share","to":"profile","label":"See it on your profile","missing":false},{"from":"share","to":"auth","label":"See the hint on Log in","missing":false},{"from":"auth","to":"home","label":"It's a Date","missing":false},{"from":"profile","to":"share","label":"Share an idea","missing":false},{"from":"profile","to":"idea-detail","label":"Couples massage","missing":false},{"from":"profile","to":"home","label":"Browse ideas","missing":false},{"from":"profile","to":"auth","label":"See the hint on Log in","missing":false},{"from":"admin","to":"home","label":"Back to all ideas","missing":false},{"from":"admin","to":"profile","label":"Saved ideas","missing":false},{"from":"admin","to":"share","label":"Share an idea","missing":false},{"from":"admin","to":"idea-detail","label":"Planetarium show","missing":false},{"from":"not-found","to":"home","label":"Back to all ideas","missing":false},{"from":"home","to":"idea-detail","label":"","missing":false,"task":0,"colour":"#1f77d0"},{"from":"home","to":"share","label":"","missing":false,"task":1,"colour":"#d0761f"},{"from":"home","to":"profile","label":"","missing":false,"task":2,"colour":"#2a9d58"}];var map=document.getElementById('map');var svg=document.getElementById('arrows');
function draw(){[].slice.call(svg.querySelectorAll('g')).forEach(function(g){g.remove()});var m=map.getBoundingClientRect();svg.setAttribute('width',map.scrollWidth);svg.setAttribute('height',map.scrollHeight);
var seen={};edges.forEach(function(e){var a=map.querySelector('[data-id="'+e.from+'"]'),b=map.querySelector('[data-id="'+e.to+'"]');if(!a||!b)return;
var key=e.from+'>'+e.to;var n=seen[key]=(seen[key]||0)+1;if(e.task!==undefined)n=1.5+e.task*0.5;var ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();var ox=map.scrollLeft-m.left,oy=map.scrollTop-m.top;
var back=rb.left<ra.left+10;var x1=(back?ra.left:ra.right)+ox,y1=ra.top+ra.height/2+oy+(n-1)*14,x2=(back?rb.right:rb.left)+ox,y2=rb.top+rb.height/2+oy+(n-1)*14;
